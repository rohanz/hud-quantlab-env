[project]
name = "hud-quantlab-env"
version = "0.1.0"
description = "A HUD RL environment: point-in-time SEC lookups graded on correctness and evidence"
authors = [{ name = "rohanz" }]
requires-python = ">=3.11"
dependencies = [
    # Tested against hud 0.6.18; 0.7 may change the Environment/eval API. env.py imports fastmcp
    # and uvicorn directly, and scripts/build_fixture.py imports httpx.
    "hud>=0.6.18,<0.7",
    "fastmcp>=3.2,<4",
    "uvicorn>=0.34,<1",
    "httpx>=0.28,<1",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/quantlab_env"]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
    "ruff>=0.16.9",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "session"
asyncio_default_test_loop_scope = "session"

[tool.ruff]
line-length = 120
